aid: tomorrow-health
name: Tomorrow Health
description: >-
  Tomorrow Health is an AI-powered platform for home-based care that connects providers, payors, and
  durable medical equipment (DMEPOS) suppliers, using intelligent automation to simplify ordering,
  routing, and reviewing home healthcare services. Its Horizon Suite includes AI Ordering, AI Fax
  Intake, and THEA (Tomorrow Health Expert Assistant). Headquartered in New York and backed by a16z,
  Bond Capital, and Obvious Ventures. No public developer API, SDK, or API documentation is currently
  published; the customer application is a private authenticated web app.
